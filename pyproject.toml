[project]
name = "sae-bench-neurons"
version = "0.1.0"
description = "Comparing neurons + RelP vs SAEs on SAEBench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core ML
    "torch>=2.4.0",
    "transformers>=4.40.0",
    "einops>=0.8.0",
    "opt-einsum>=3.3.0",
    
    # SAEBench dependencies
    "sae-lens>=6.0.0",
    "transformer-lens>=2.0.0",
    "scikit-learn>=1.5.2",
    "pandas>=2.1.2",
    "numpy>=1.26.4,<2.0",
    "tqdm>=4.66.4",
    "pydantic>=2.9.2",
    
    # Circuits dependencies  
    "nnsight>=0.3.0,<0.4.0",
    
    # Visualization
    "matplotlib>=3.8.4",
    "seaborn>=0.13.2",
    "plotly>=5.22.0",
    
    # Utils
    "requests>=2.31.0",
    "huggingface-hub>=0.20.0",
    "datasets>=3.0.0",
    "accelerate>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neurons_bench"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
]
