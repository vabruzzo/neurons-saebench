[project]
name = "neurons-relp"
version = "0.1.0"
description = "RelP attribution analysis for MLP neurons in Llama 3.1 8B"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.40.0",
    "tqdm>=4.66.4",
    "accelerate>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neurons_bench"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
